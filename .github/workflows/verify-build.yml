name: Verify build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
      - name: Verify required content
        run: |
          set -e
          for f in _site/index.html _site/publications/index.html; do
            grep -q "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" "$f"
            grep -q "On the Perception Bottleneck of VLMs for Chart Understanding" "$f"
            grep -q "On the Universal Truthfulness Hyperplane Inside LLMs" "$f"
            grep -q "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" "$f"
            grep -q "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" "$f"
            grep -q "Composing Parameter-Efficient Modules with Arithmetic Operations" "$f"
          done
          grep -q "Shanghai AI Lab" _site/index.html
          grep -q "Tencent WXG" _site/index.html
          grep -q "MINIMAX" _site/index.html
          grep -q "Zhiyuan Honor Scholarship" _site/index.html
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "HKUST NLP Group" _site/index.html
          grep -q "LLM Reasoning and Reinforcement Learning" _site/index.html
          echo "All content checks passed"
